worker_processes auto;
events { worker_connections 4096; }
http {
  # Docker's embedded DNS returns one A record per api replica; nginx round-robins across them.
  upstream api {
    least_conn;
    server api:8000 max_fails=3 fail_timeout=10s;
    keepalive 64;
  }
  log_format timed '$remote_addr "$request" $status $request_time $upstream_addr';
  access_log /dev/stdout timed;
  client_max_body_size 200m;   # bulk ZIP uploads
  server {
    listen 80;
    location / {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 300s;
      proxy_next_upstream error timeout http_502 http_503;
    }
    location = /lb-health { return 200 "ok\n"; }
  }
}
